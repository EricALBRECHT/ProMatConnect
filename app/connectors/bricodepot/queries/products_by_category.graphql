# Liste SKU d'une famille (page Magento effective ~36).
query ProductsByCategory(
  $filter: ProductAttributeFilterInput
  $currentPage: Int
  $pageSize: Int
) {
  products(filter: $filter, currentPage: $currentPage, pageSize: $pageSize) {
    total_count
    page_info {
      current_page
      page_size
      total_pages
    }
    items {
      sku
    }
  }
}
