<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="{% block description %}Comparateur B2B de matériaux pour les artisans du bâtiment.{% endblock %}" />
    <title>{% block title %}ProMatConnect{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}" />
    {% block head %}{% endblock %}
  </head>
  <body>
    {% include "partials/topbar.html" %}
    <main>{% block content %}{% endblock %}</main>
    <footer>
      <span
        >ProMatConnect
        <span class="muted">/ Le comparateur des pros du bâtiment</span></span
      ><a href="/docs">Documentation API ↗</a>
    </footer>
    {% block scripts %}{% endblock %}
  </body>
</html>
