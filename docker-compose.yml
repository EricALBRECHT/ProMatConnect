services:
  db:
    image: postgres:16-alpine
    # Docker plafonne /dev/shm à 64 Mo par défaut. PostgreSQL y place
    # segments System V (tri, hash, parallélisme) : sous charge pytest
    # (schéma par test) → "could not resize shared memory segment" puis recovery.
    # 512m = marge confortable pour la suite complète (web + profil test
    # partagent ce même service db).
    shm_size: "512m"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-promatconnect}
      POSTGRES_USER: ${POSTGRES_USER:-promatconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_demo_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  web:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-promatconnect}:${POSTGRES_PASSWORD:-local_demo_only}@db:5432/${POSTGRES_DB:-promatconnect}
      USER_LATITUDE: ${USER_LATITUDE:-48.8566}
      USER_LONGITUDE: ${USER_LONGITUDE:-2.3522}
      SEED_ON_START: ${SEED_ON_START:-true}
      SITE_ADDRESS: ${SITE_ADDRESS:-10 rue du Chantier, 75004 Paris}
      COMPANY_ADDRESS: ${COMPANY_ADDRESS:-20 rue de l'Entreprise, 75011 Paris}
      COMPANY_LATITUDE: ${COMPANY_LATITUDE:-48.8600}
      COMPANY_LONGITUDE: ${COMPANY_LONGITUDE:-2.3800}
      COST_PER_KM: ${COST_PER_KM:-0.50}
      TIME_VALUE_PER_HOUR: ${TIME_VALUE_PER_HOUR:-30.00}
      EXTRA_STOP_COST: ${EXTRA_STOP_COST:-5.00}
      OPTIMIZER_MAX_AGENCIES: ${OPTIMIZER_MAX_AGENCIES:-8}
      GEOCODING_PROVIDER: ${GEOCODING_PROVIDER:-fake}
      BRICODEPOT_LIVE_ENABLED: ${BRICODEPOT_LIVE_ENABLED:-false}
      BRICODEPOT_MAX_STORES: ${BRICODEPOT_MAX_STORES:-3}
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  tests:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-promatconnect}:${POSTGRES_PASSWORD:-local_demo_only}@db:5432/promatconnect_test
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
